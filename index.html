<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayır Ailesi Yemek & Tarif Sistemi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.90);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.8);
      --input-border: #475569;
      --success: #10b981;
      --danger: #ef4444;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding-bottom: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Kalpler Artık Sadece Yan Kenarlarda Akıyor (Panellerin Üstünü Kapatmaz) */
    .floating-hearts {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      color: #ef4444;
      font-size: 24px;
      animation: flyUp 4s linear infinite;
      opacity: 0.7;
    }
    @keyframes flyUp {
      0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
    }

    .container {
      width: 100%; max-width: 440px; padding: 16px; z-index: 10; position: relative;
    }

    .card {
      width: 100%; background: var(--card-bg); padding: 24px;
      border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color); backdrop-filter: blur(12px);
      text-align: center;
    }

    h2 { font-size: 1.4rem; margin-bottom: 16px; }
    h3 { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 10px; text-align: left; }

    input, select, textarea {
      width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 12px;
      border: 1px solid var(--input-border); background: var(--input-bg);
      color: var(--text); font-size: 14px; outline: none; font-family: inherit;
    }

    button.action-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: var(--primary); color: white; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: all 0.2s;
    }
    button.action-btn:hover { background: var(--primary-hover); }
    button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-green { background: var(--success); }
    .hidden { display: none !important; }

    .poll-card {
      background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 16px;
      margin-bottom: 16px; border: 1px solid var(--border-color); text-align: left;
    }

    .ingredient-badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px;
      font-weight: 700; margin: 3px 2px;
    }
    .badge-has { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge-missing { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg);
      border-top: 1px solid var(--border-color); display: flex; backdrop-filter: blur(12px); z-index: 100;
    }
    .nav-item {
      flex: 1; padding: 14px; text-align: center; background: transparent; border: none;
      color: var(--text-muted); font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .nav-item.active { color: var(--primary); border-top: 2px solid var(--primary); }
  </style>
</head>
<body>

  <!-- Yan Kenarlardan Uçuşan Kalpler -->
  <div class="floating-hearts" id="heartContainer"></div>

  <div class="container">
    <div id="loginScreen" class="card">
      <h2>❤️ Bayır Ailesi Girişi</h2>
      <select id="userSelect">
        <option value="">Kullanıcı Seçiniz...</option>
        <option value="Baba">Baba</option>
        <option value="Anne">Anne</option>
        <option value="Kerem">Kerem</option>
        <option value="Abi">Abi</option>
      </select>
      <input type="password" id="passInput" placeholder="Şifre (1234)">
      <button class="action-btn" onclick="girisYap()">Giriş Yap</button>
    </div>

    <div id="appScreen" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <span id="userInfo" style="font-weight:700; color:#38bdf8;"></span>
        <button onclick="cikisYap()" class="action-btn" style="width:auto; padding:6px 12px; background:#475569; font-size:12px;">Çıkış</button>
      </div>

      <div id="tabOylama">
        <h3>🍲 Günün Yemeğini Öner</h3>
        <input type="text" id="mainFood" placeholder="Yemek Adı (Örn: Mantı)">
        <button class="action-btn btn-green" onclick="yemekOner()">Öneriyi Gönder</button>
        <hr style="border:0; border-top:1px solid var(--border-color); margin:16px 0;">
        <h3>📌 Aktif Oylamalar</h3>
        <div id="voteArea">Yükleniyor...</div>
      </div>

      <div id="tabTarifler" class="hidden">
        <h3>📸 Fiş Fotoğrafı Okut</h3>
        <input type="file" id="fisInput" accept="image/*">
        <button class="action-btn" id="btnOcr" onclick="fisOku()">🧾 Fişi Okut ve Dolaba Ekle</button>
        <div id="ocrStatus" style="font-size:12px; color:var(--text-muted); margin-top:6px;"></div>

        <div style="margin-top:14px; text-align:left;">
          <label style="font-size:12px; color:var(--text-muted);">Elle Malzeme Ekle (Virgülle Ayır):</label>
          <input type="text" id="manuelMalzeme" placeholder="Örn: Süt, Yumurta, Domates">
          <button class="action-btn btn-green" onclick="manuelMalzemeEkle()">Dolaba Ekle</button>
        </div>

        <div class="poll-card" style="margin-top:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h4 style="margin:0;">🧊 Dolaptaki Malzemeler:</h4>
            <button onclick="dolabiBosalt()" class="action-btn" style="width:auto; padding:4px 10px; background:var(--danger); font-size:12px;">🗑️ Dolabı Boşalt</button>
          </div>
          <div id="dolapListesi">Yükleniyor...</div>
        </div>

        <hr style="border:0; border-top:1px solid var(--border-color); margin:16px 0;">

        <h3>🎬 Reels Tarifi Kaydet</h3>
        <input type="text" id="tarifAdi" placeholder="Tarif Adı (Örn: Kremalı Tavuk)">
        <input type="text" id="reelsUrl" placeholder="Instagram Reels Linki">
        <textarea id="tarifMalzemeler" rows="3" placeholder="Malzemeleri virgülle ayırın (Örn: Tavuk, Krema, Mantar)"></textarea>
        <button class="action-btn btn-green" onclick="tarifKaydet()">Tarifi Ekle</button>

        <h3 style="margin-top:16px;">📜 Kayıtlı Tarifler</h3>
        <div id="tariflerListesi">Yükleniyor...</div>
      </div>
    </div>
  </div>

  <div id="bottomNav" class="bottom-nav hidden">
    <button class="nav-item active" id="btnTabOylama" onclick="sekmeDegistir('oylama')">🗳️ Oylamalar</button>
    <button class="nav-item" id="btnTabTarifler" onclick="sekmeDegistir('tarifler')">📖 Tarifler & Dolap</button>
  </div>

  <script>
    // Kalpleri Sadece Yan Kenarlara (Sol ve Sağ Boşluklara) Dağıtan Fonksiyon
    function createHeart() {
      const container = document.getElementById('heartContainer');
      if (!container) return;
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤️';
      
      // Ekranın ortasındaki kartı (440px) pas geçip sadece sağ ve soldan akması için:
      const side = Math.random() > 0.5;
      const posX = side ? (Math.random() * 22) : (78 + Math.random() * 20); // Ya sol %0-22 ya sağ %78-98
      
      heart.style.left = posX + 'vw';
      heart.style.animationDuration = (Math.random() * 2.5 + 2.5) + 's';
      heart.style.fontSize = (Math.random() * 14 + 16) + 'px';
      
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 250);

    const SUPABASE_URL = 'https://vcjrivgycetdjlporarj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fzLprz7OMs8hCJC4l-qmAw_gSBTcL-b';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const SIFRELER = { "Baba": "1234", "Anne": "1234", "Kerem": "1234", "Abi": "1234" };
    let aktifKullanici = localStorage.getItem('bayir_user') || null;

    window.onload = () => {
      if (aktifKullanici) ekraniGuncelle();
    };

    function girisYap() {
      const u = document.getElementById('userSelect').value;
      const p = document.getElementById('passInput').value;
      if (SIFRELER[u] && SIFRELER[u] === p) {
        aktifKullanici = u;
        localStorage.setItem('bayir_user', u);
        ekraniGuncelle();
      } else alert("Hatalı Şifre veya Kullanıcı!");
    }

    function cikisYap() {
      localStorage.removeItem('bayir_user');
      location.reload();
    }

    function ekraniGuncelle() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('bottomNav').classList.remove('hidden');
      document.getElementById('userInfo').innerText = '👤 ' + aktifKullanici;
      oylamaGetir();
      dolapGetir();
      tarifleriGetir();
    }

    function sekmeDegistir(sekme) {
      if (sekme === 'oylama') {
        document.getElementById('tabOylama').classList.remove('hidden');
        document.getElementById('tabTarifler').classList.add('hidden');
        document.getElementById('btnTabOylama').classList.add('active');
        document.getElementById('btnTabTarifler').classList.remove('active');
      } else {
        document.getElementById('tabOylama').classList.add('hidden');
        document.getElementById('tabTarifler').classList.remove('hidden');
        document.getElementById('btnTabOylama').classList.remove('active');
        document.getElementById('btnTabTarifler').classList.add('active');
      }
    }

    async function fisOku() {
      const fileInput = document.getElementById('fisInput');
      const status = document.getElementById('ocrStatus');
      const btn = document.getElementById('btnOcr');

      if (!fileInput.files || fileInput.files.length === 0) return alert("Lütfen fiş görseli seçin!");

      btn.disabled = true;
      status.innerText = "⏳ Fiş taranıyor, çöp karakterler ve market adları temizleniyor...";

      try {
        const file = fileInput.files[0];
        const result = await Tesseract.recognize(file, 'tur');
        const tumSatirlar = result.data.text.split('\n');

        // Kesin Gıda ve Malzeme Beyaz Listesi
        const gidaKelimeleri = [
          'SÜT', 'YUMURTA', 'EKMEK', 'PEYNİR', 'PEYNIR', 'ET', 'TAVUK', 'KİYMA', 'KIYMA', 
          'DOMATES', 'BİBER', 'BIBER', 'PATATES', 'SOĞAN', 'SOGAN', 'MAKARNA', 'PİRİNÇ', 'PIRINC', 
          'ŞEKER', 'SEKER', 'UN', 'YAĞ', 'YAG', 'ZEYTİN', 'ZEYTIN', 'ÇAY', 'CAY', 'KAHVE', 
          'SU', 'YOĞURT', 'YOGURT', 'TERAYAĞ', 'TERAYAG', 'SALÇA', 'SALCA', 'MERCİMEK', 'MERCIMEK',
          'FINISH', 'ARKO', 'OZMO', 'KETÇAP', 'KETCAP', 'MAYONEZ', 'BULAŞIK', 'BULASIK',
          'ÇAMAŞIR', 'CAMASIR', 'DEREOTİ', 'MAYDANOZ', 'LİMON', 'LIMON', 'MUZ', 'ELMA', 'PORTAKAL',
          'PİLİÇ', 'PILIC', 'BAGET', 'DANA', 'MACA'
        ];

        // Tamamen atılacak çöp kelimeler (Market isimleri, fiş başlıkları vb.)
        const copKelimeler = ['ŞOK', 'A101', 'MİGROS', 'BIM', 'MARKET', 'TÜN', 'AE', 'TL', 'POS', 'TARIH', 'SAAT'];

        const filtrelenmisUrunler = [];

        tumSatirlar.forEach(satir => {
          let temiz = satir.trim();
          let ust = temiz.toUpperCase();

          if (temiz.length < 3) return;
          if (/^[\d\s\.,<>:\-\/]+$/.test(temiz)) return;

          let eslesti = false;
          for (let kelime of gidaKelimeleri) {
            if (ust.includes(kelime)) {
              eslesti = true;
              break;
            }
          }

          if (eslesti) {
            // Çöp kelimeleri, tireleri, özel simgeleri ve sayı kalıntılarını tamamen temizle
            copKelimeler.forEach(cop => {
              ust = ust.replace(new RegExp(cop, 'g'), '');
            });

            let temizUrun = ust
              .replace(/[—–\-*&|+\\|"«»\(\)]/g, '') // Tüm tire ve sembolleri sil
              .replace(/\d+[\.,]\d+\s*(KG|GR|LT|ML|X)?/gi, '') // Gramaj/Fiyatları sil
              .replace(/[\d\.,<>:\-\/]+/g, '') // Kalan sayıları sil
              .trim();

            if (temizUrun.length > 2) {
              filtrelenmisUrunler.push(temizUrun);
            }
          }
        });

        const benzersizUrunler = [...new Set(filtrelenmisUrunler)];

        if (benzersizUrunler.length === 0) {
          status.innerText = "⚠️ Fişte net ürün bulunamadı. Elle malzeme ekleyebilirsin.";
          btn.disabled = false;
          return;
        }

        const eklenecekler = benzersizUrunler.map(urun => ({
          malzeme_adi: urun,
          ekleyen_kisi: aktifKullanici
        }));

        const { error } = await _supabase.from('dolaptakiler').insert(eklenecekler);

        if (error) {
          status.innerText = "❌ Hata: " + error.message;
        } else {
          status.innerText = `✅ ${benzersizUrunler.length} adet saf ürün dolaba eklendi!`;
          dolapGetir();
          tarifleriGetir();
        }

      } catch (e) {
        status.innerText = "❌ Okuma hatası oluştu.";
      } finally {
        btn.disabled = false;
      }
    }

    async function manuelMalzemeEkle() {
      const val = document.getElementById('manuelMalzeme').value.trim();
      if (!val) return;

      const liste = val.split(',').map(m => m.trim());
      const eklenecekler = liste.filter(i => i).map(item => ({
        malzeme_adi: item.toUpperCase(),
        ekleyen_kisi: aktifKullanici
      }));

      await _supabase.from('dolaptakiler').insert(eklenecekler);

      document.getElementById('manuelMalzeme').value = '';
      dolapGetir();
      tarifleriGetir();
    }

    async function dolapGetir() {
      const { data } = await _supabase.from('dolaptakiler').select('*');
      const el = document.getElementById('dolapListesi');

      if (!data || data.length === 0) {
        el.innerHTML = "<em style='color:var(--text-muted); font-size:12px;'>Dolap boş.</em>";
        return;
      }

      el.innerHTML = data.map(d => `<span class="ingredient-badge badge-has">✓ ${d.malzeme_adi}</span>`).join(' ');
    }

    async function dolabiBosalt() {
      if (!confirm("Dolaptaki TÜM malzemeleri silmek istediğinden emin misin?")) return;

      const { error } = await _supabase.from('dolaptakiler').delete().neq('id', 0);

      if (error) {
        alert("Silinirken hata oluştu: " + error.message);
      } else {
        alert("Dolap başarıyla boşaltıldı!");
        dolapGetir();
        tarifleriGetir();
      }
    }

    async function tarifKaydet() {
      const ad = document.getElementById('tarifAdi').value.trim();
      const url = document.getElementById('reelsUrl').value.trim();
      const malzText = document.getElementById('tarifMalzemeler').value.trim();

      if (!ad || !malzText) return alert("Tarif adı ve malzemeleri boş bırakılamaz!");

      const malzemeler = malzText.split(',').map(m => m.trim());

      await _supabase.from('tarifler').insert([{
        tarif_adi: ad,
        reels_link: url,
        malzemeler: malzemeler,
        ekleyen_kisi: aktifKullanici
      }]);

      document.getElementById('tarifAdi').value = '';
      document.getElementById('reelsUrl').value = '';
      document.getElementById('tarifMalzemeler').value = '';

      tarifleriGetir();
    }

    async function tarifleriGetir() {
      const { data: dolapData } = await _supabase.from('dolaptakiler').select('malzeme_adi');
      const evdekiMalzemeler = dolapData ? dolapData.map(d => d.malzeme_adi.toLowerCase()) : [];

      const { data: tarifler } = await _supabase.from('tarifler').select('*');
      const area = document.getElementById('tariflerListesi');

      if (!tarifler || tarifler.length === 0) {
        area.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>Henüz kayıtlı tarif yok.</p>";
        return;
      }

      let html = '';
      tarifler.forEach(t => {
        let malzemeHTML = '';
        let gerekliler = t.malzemeler || [];
        if (typeof gerekliler === 'string') gerekliler = gerekliler.split(',');

        gerekliler.forEach(m => {
          const temizM = m.trim().toLowerCase();
          const varMi = evdekiMalzemeler.some(evde => evde.includes(temizM) || temizM.includes(evde));
          
          if (varMi) {
            malzemeHTML += `<span class="ingredient-badge badge-has">✓ ${m.trim()}</span> `;
          } else {
            malzemeHTML += `<span class="ingredient-badge badge-missing">✕ ${m.trim()}</span> `;
          }
        });

        html += `
          <div class="poll-card">
            <h4 style="margin:0 0 6px 0;">${t.tarif_adi}</h4>
            ${t.reels_link ? `<a href="${t.reels_link}" target="_blank" style="color:#38bdf8; font-size:12px;">🎬 Reels Videosunu İzle</a><br>` : ''}
            <div style="margin-top:8px;">
              <small style="color:var(--text-muted);">Malzeme Durumu:</small><br>
              ${malzemeHTML}
            </div>
          </div>
        `;
      });

      area.innerHTML = html;
    }

    async function yemekOner() {
      const val = document.getElementById('mainFood').value.trim();
      if (!val) return;
      await _supabase.from('yemek_secimi').insert([{ onerilen_yemek: val, oneren_kisi: aktifKullanici, durum: 'Oylanıyor' }]);
      document.getElementById('mainFood').value = '';
      oylamaGetir();
    }

    async function oylamaGetir() {
      const alan = document.getElementById('voteArea');
      const { data } = await _supabase.from('yemek_secimi').select('*');
      if (!data || data.length === 0) {
        alan.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>Aktif oylama yok.</p>";
        return;
      }
      alan.innerHTML = data.map(d => `
        <div class="poll-card">
          <strong>${d.onerilen_yemek}</strong> (${d.oneren_kisi})<br>
          <small>Durum: ${d.durum}</small>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
